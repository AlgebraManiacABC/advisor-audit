services:
  app:
    build: ..
    env_file: ../.env
    restart: unless-stopped
    expose: ["8000"]
    # No volumes: uploads and sessions never touch disk.
    read_only: true
    tmpfs: ["/tmp"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
